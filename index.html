<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MARKET OVERVIEW | VOGUE Style</title>
    
    <!-- Google Fonts: VOGUE風のエレガントなセリフ体と、モダンなサンセリフ体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FBFBFB; /* わずかに温かみのある大理石のような白 */
            --border-color: #E0E0E0;
            --text-main: #111111; /* 漆黒 */
            --text-sub: #888888;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            --up-color: #1d5733; /* エレガントな深緑 */
            --down-color: #8a1e1e; /* エレガントな深紅 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            margin: 0;
            padding: 4rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 雑誌の表紙のようなヘッダー */
        .header-section {
            text-align: center;
            margin-bottom: 4rem;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 0 0 0.5rem 0;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        /* 洗練されたシャープなカード */
        .card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 2rem;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border-radius: 0; /* 角丸をなくしエッジを効かせる */
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card:hover {
            border-color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-style: italic;
            color: var(--text-main);
        }

        .live-indicator {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-main);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .card-body {
            font-size: 3.2rem;
            font-weight: 300;
            text-align: right;
            letter-spacing: -0.02em;
            margin-top: auto;
            transition: color 0.4s ease;
        }

        .sats-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: auto;
        }

        .sats-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .sats-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .sats-value {
            font-size: 1.8rem;
            font-weight: 300;
        }

        /* --- TradingView カード特例（真っ黒問題の解決部分） --- */
        .tv-card {
            padding: 0;
            overflow: hidden;
        }

        /* 絶対配置で強制的に親枠にフィットさせる */
        .tradingview-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .tradingview-widget-container {
            width: 100% !important;
            height: 100% !important;
        }

        .chart-label {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 10;
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 1.3rem;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 10px;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        /* 派手な発光をやめ、文字色がスッと変わるエレガントなアニメーション */
        .flash-up { animation: elegantUp 1.2s ease-out; }
        .flash-down { animation: elegantDown 1.2s ease-out; }

        @keyframes elegantUp {
            0% { color: var(--up-color); }
            100% { color: var(--text-main); }
        }

        @keyframes elegantDown {
            0% { color: var(--down-color); }
            100% { color: var(--text-main); }
        }

        .loading {
            color: var(--border-color);
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .card { height: 220px; }
            .card-body { font-size: 2.4rem; }
            .dashboard { gap: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>The Market Overview</h1>
        <div class="subtitle">Real-time Financial & Crypto Indices</div>
    </div>

    <div class="dashboard">

        <!-- 1. BTC/USD -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Bitcoin (BTC/USD)</span>
                <span class="live-indicator"><span class="live-dot"></span>LIVE</span>
            </div>
            <div class="card-body loading" id="btc-usd">...</div>
        </div>

        <!-- 2. 1 Sats -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">1 Satoshi</span>
                <span class="live-indicator"><span class="live-dot"></span>LIVE</span>
            </div>
            <div class="sats-container">
                <div class="sats-item">
                    <span class="sats-label">USD</span>
                    <span class="sats-value loading" id="sats-usd">...</span>
                </div>
                <div class="sats-item">
                    <span class="sats-label">JPY</span>
                    <span class="sats-value loading" id="sats-jpy">...</span>
                </div>
            </div>
        </div>

        <!-- 3. S&P 500 (OANDA) -->
        <div class="card tv-card">
            <div class="chart-label">S&P 500</div>
            <div class="tradingview-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/tv-widget-mini-symbol-overview.js" async>
                    {
                        "symbol": "OANDA:SPX500USD",
                        "width": "100%",
                        "height": "100%",
                        "locale": "ja",
                        "dateRange": "1D",
                        "colorTheme": "light",
                        "isTransparent": true,
                        "autosize": true,
                        "largeChartUrl": ""
                    }
                    </script>
                </div>
            </div>
        </div>

        <!-- 4. 日経平均株価 (OANDA) -->
        <div class="card tv-card">
            <div class="chart-label">Nikkei 225</div>
            <div class="tradingview-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/tv-widget-mini-symbol-overview.js" async>
                    {
                        "symbol": "OANDA:JP225JPY",
                        "width": "100%",
                        "height": "100%",
                        "locale": "ja",
                        "dateRange": "1D",
                        "colorTheme": "light",
                        "isTransparent": true,
                        "autosize": true,
                        "largeChartUrl": ""
                    }
                    </script>
                </div>
            </div>
        </div>

        <!-- 5. 米国債10年金利 -->
        <div class="card tv-card">
            <div class="chart-label">US 10Y Yield</div>
            <div class="tradingview-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/tv-widget-mini-symbol-overview.js" async>
                    {
                        "symbol": "TVC:US10Y",
                        "width": "100%",
                        "height": "100%",
                        "locale": "ja",
                        "dateRange": "1D",
                        "colorTheme": "light",
                        "isTransparent": true,
                        "autosize": true,
                        "largeChartUrl": ""
                    }
                    </script>
                </div>
            </div>
        </div>

        <!-- 6. 日本国債10年金利 -->
        <div class="card tv-card">
            <div class="chart-label">JP 10Y Yield</div>
            <div class="tradingview-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/tv-widget-mini-symbol-overview.js" async>
                    {
                        "symbol": "TVC:JP10Y",
                        "width": "100%",
                        "height": "100%",
                        "locale": "ja",
                        "dateRange": "1D",
                        "colorTheme": "light",
                        "isTransparent": true,
                        "autosize": true,
                        "largeChartUrl": ""
                    }
                    </script>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    
    function flashElement(el, className) {
        el.classList.remove('flash-up', 'flash-down', 'loading');
        void el.offsetWidth;
        el.classList.add(className);
    }

    const btcUsdEl = document.getElementById('btc-usd');
    const satsUsdEl = document.getElementById('sats-usd');
    let lastBtcUsd = 0;

    function connectBinance() {
        const binanceWs = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');
        
        binanceWs.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const currentPrice = parseFloat(data.c);
            
            btcUsdEl.innerText = `$${currentPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const satsUsd = currentPrice / 100000000;
            satsUsdEl.innerText = `$${satsUsd.toFixed(6)}`;

            if (lastBtcUsd !== 0) {
                if (currentPrice > lastBtcUsd) {
                    flashElement(btcUsdEl, 'flash-up');
                    flashElement(satsUsdEl, 'flash-up');
                } else if (currentPrice < lastBtcUsd) {
                    flashElement(btcUsdEl, 'flash-down');
                    flashElement(satsUsdEl, 'flash-down');
                }
            }
            lastBtcUsd = currentPrice;
        };

        binanceWs.onclose = () => setTimeout(connectBinance, 5000); 
    }
    connectBinance();

    const satsJpyEl = document.getElementById('sats-jpy');
    let lastBtcJpy = 0;

    function connectBitflyer() {
        const bitflyerWs = new WebSocket('wss://ws.lightstream.bitflyer.com/json-rpc');
        
        bitflyerWs.onopen = () => {
            bitflyerWs.send(JSON.stringify({
                method: "subscribe",
                params: { channel: "lightning_ticker_BTC_JPY" }
            }));
        };

        bitflyerWs.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (response.params && response.params.message) {
                const currentPrice = response.params.message.ltp;
                
                const satsJpy = currentPrice / 100000000;
                satsJpyEl.innerText = `¥${satsJpy.toFixed(4)}`;

                if (lastBtcJpy !== 0) {
                    if (currentPrice > lastBtcJpy) {
                        flashElement(satsJpyEl, 'flash-up');
                    } else if (currentPrice < lastBtcJpy) {
                        flashElement(satsJpyEl, 'flash-down');
                    }
                }
                lastBtcJpy = currentPrice;
            }
        };

        bitflyerWs.onclose = () => setTimeout(connectBitflyer, 5000); 
    }
    connectBitflyer();

});
</script>
</body>
</html>
