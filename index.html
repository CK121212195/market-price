<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Analytics Tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X1J77SKSG3"></script>
    <script>
      window.dataLayer = window.dataLayer ||[];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X1J77SKSG3');
    </script>

    <!-- Meta Tags -->
    <title>THE BITCOIN OVERVIEW | VOGUE Style</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta property="og:title" content="THE BITCOIN OVERVIEW | VOGUE Style">
    <meta property="og:description" content="Real-time Bitcoin Dashboard & Converter">
    <meta property="og:image" content="og-image.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FFFFFF;
            --border-color: #EAEAEA;
            --text-main: #000000;
            --text-sub: #888888;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            
            --up-color: #00A651; /* ボッテガ・グリーン */
            --down-color: #E3000F; /* ルブタン・レッド */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            margin: 0;
            padding: 4rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* --- Header --- */
        .header-section {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 0 0 0.5rem 0;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 300;
        }

        /* --- Live Market Cards --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card:hover {
            border-color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-main);
        }

        .live-indicator {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            font-weight: 500;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-main);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }

        .card-body {
            font-size: 3.4rem;
            font-weight: 200;
            text-align: right;
            letter-spacing: -0.03em;
            margin-top: auto;
            transition: color 0.4s ease;
        }

        .price-up { color: var(--up-color) !important; text-shadow: 0 0 20px rgba(0, 166, 81, 0.1); }
        .price-down { color: var(--down-color) !important; text-shadow: 0 0 20px rgba(227, 0, 15, 0.1); }

        .sats-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: auto;
        }

        .sats-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .sats-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .sats-value { font-size: 1.8rem; font-weight: 300; transition: color 0.4s ease; }
        .loading { color: var(--border-color) !important; font-size: 1.5rem; font-style: italic; }

        /* --- Converter Section --- */
        .section-header {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-style: italic;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .converter-box {
            background: #FAFAFA;
            border: 1px solid var(--border-color);
            padding: 1.5rem 3rem;
            margin-bottom: 4rem;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 0;
            transition: border-color 0.3s;
        }
        
        .input-group:focus-within { border-bottom-color: var(--text-main); }
        .input-group:last-child { border-bottom: none; }

        .currency-icon {
            font-size: 1.5rem;
            width: 40px;
            color: var(--text-sub);
            font-family: var(--font-heading);
        }

        .input-group input {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            text-align: right;
            font-size: 2.2rem;
            font-family: var(--font-body);
            font-weight: 300;
            color: var(--text-main);
            padding: 0 1.5rem;
        }

        /* スピナーを隠す */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .currency-label {
            font-size: 0.9rem;
            color: var(--text-sub);
            width: 50px;
            text-align: right;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* --- Actions (Tip & Share) --- */
        .actions-wrapper {
            display: flex;
            gap: 2rem;
            margin-bottom: 5rem;
            flex-wrap: wrap;
        }

        .action-box {
            flex: 1;
            min-width: 300px;
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            text-align: center;
        }

        .action-box h3 {
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            font-family: var(--font-body);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
        }

        .btn:hover { background: var(--text-main); color: var(--bg-color); }
        .btn-primary { background: var(--text-main); color: var(--bg-color); }
        .btn-primary:hover { background: transparent; color: var(--text-main); }

        /* --- Other Games Section --- */
        .games-section {
            border-top: 1px solid var(--border-color);
            padding-top: 3rem;
            text-align: center;
        }

        .games-title {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .games-grid {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 150px;
            height: 110px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .game-card:hover {
            background: var(--text-main);
            color: var(--bg-color);
            transform: translateY(-3px);
        }

        .game-icon { font-size: 1.8rem; margin-bottom: 0.8rem; }
        .game-name { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em; }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .card { height: 200px; padding: 1.5rem; }
            .card-body { font-size: 2.4rem; }
            .input-group input { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- HEADER -->
    <div class="header-section">
        <h1>The Bitcoin Overview</h1>
        <div class="subtitle">Real-time Dashboard & Converter</div>
    </div>

    <!-- LIVE MARKET -->
    <div class="dashboard">
        <div class="card">
            <div class="card-header">
                <span class="card-title">Bitcoin (BTC/USD)</span>
                <span class="live-indicator"><span class="live-dot"></span>LIVE</span>
            </div>
            <div class="card-body loading" id="btc-usd">Fetching...</div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">1 Satoshi</span>
                <span class="live-indicator"><span class="live-dot"></span>LIVE</span>
            </div>
            <div class="sats-container">
                <div class="sats-item">
                    <span class="sats-label">USD</span>
                    <span class="sats-value loading" id="sats-usd">...</span>
                </div>
                <div class="sats-item">
                    <span class="sats-label">JPY</span>
                    <span class="sats-value loading" id="sats-jpy">...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- CONVERTER -->
    <h2 class="section-header">Live Converter</h2>
    <div class="converter-box">
        <div class="input-group">
            <span class="currency-icon">₿</span>
            <input type="number" id="input-sats" value="100">
            <span class="currency-label">sats</span>
        </div>
        <div class="input-group">
            <span class="currency-icon">₿</span>
            <input type="number" id="input-btc">
            <span class="currency-label">BTC</span>
        </div>
        <div class="input-group">
            <span class="currency-icon">¥</span>
            <input type="number" id="input-jpy">
            <span class="currency-label">JPY</span>
        </div>
        <div class="input-group">
            <span class="currency-icon">$</span>
            <input type="number" id="input-usd">
            <span class="currency-label">USD</span>
        </div>
    </div>

    <!-- ACTIONS (Tip & Share) -->
    <div class="actions-wrapper">
        <div class="action-box">
            <h3>Support with Lightning ⚡️</h3>
            <div class="btn-group">
                <!-- Wallet of Satoshi のアドレスを設定済み -->
                <button class="btn" onclick="sendTip(100, 'brashridge65@walletofsatoshi.com')">100 sats</button>
                <button class="btn" onclick="sendTip(1000, 'brashridge65@walletofsatoshi.com')">1,000 sats</button>
                <button class="btn" onclick="sendTip(10000, 'brashridge65@walletofsatoshi.com')">10,000 sats</button>
            </div>
        </div>
        
        <div class="action-box">
            <h3>Share the Market</h3>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="shareTwitter()">Share on X</button>
            </div>
        </div>
    </div>

    <!-- OTHER GAMES -->
    <div class="games-section">
        <div class="games-title">Other Games</div>
        <div class="games-grid">
            <a href="https://ck121212195.github.io/Plinko-Bitcoin/" target="_blank" class="game-card">
                <span class="game-icon">🎰</span>
                <span class="game-name">Plinko Bitcoin</span>
            </a>
            <a href="https://ck121212195.github.io/Bitcoin-Run/" target="_blank" class="game-card">
                <span class="game-icon">🏃‍♂️</span>
                <span class="game-name">Bitcoin Run</span>
            </a>
            <a href="https://ck121212195.github.io/omikuji_japan_only/" target="_blank" class="game-card">
                <span class="game-icon">⛩️</span>
                <span class="game-name">Omikuji</span>
            </a>
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    
    // --- グローバルレート ---
    let rateUsd = 0;
    let rateJpy = 0;
    let currentFocus = 'sats'; 

    const btcUsdEl = document.getElementById('btc-usd');
    const satsUsdEl = document.getElementById('sats-usd');
    const satsJpyEl = document.getElementById('sats-jpy');

    // ==========================================
    // 1. WebSocket データ取得
    // ==========================================
    function connectBinance() {
        const binanceWs = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');
        binanceWs.onmessage = (event) => {
            const data = JSON.parse(event.data);
            rateUsd = parseFloat(data.c);
            const priceChange = parseFloat(data.p); 
            
            btcUsdEl.innerText = `$${rateUsd.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const satsUsd = rateUsd / 100000000;
            satsUsdEl.innerText = `$${satsUsd.toFixed(6)}`;

            btcUsdEl.className = 'card-body';
            satsUsdEl.className = 'sats-value';
            if (priceChange > 0) {
                btcUsdEl.classList.add('price-up');
                satsUsdEl.classList.add('price-up');
            } else if (priceChange < 0) {
                btcUsdEl.classList.add('price-down');
                satsUsdEl.classList.add('price-down');
            }

            updateConverter();
        };
        binanceWs.onclose = () => setTimeout(connectBinance, 5000); 
    }

    function connectBitflyer() {
        const bitflyerWs = new WebSocket('wss://ws.lightstream.bitflyer.com/json-rpc');
        bitflyerWs.onopen = () => {
            bitflyerWs.send(JSON.stringify({ method: "subscribe", params: { channel: "lightning_ticker_BTC_JPY" } }));
        };
        bitflyerWs.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (response.params && response.params.message) {
                rateJpy = response.params.message.ltp;
                const satsJpy = rateJpy / 100000000;
                satsJpyEl.innerText = `¥${satsJpy.toFixed(4)}`;

                satsJpyEl.className = 'sats-value';
                if (btcUsdEl.classList.contains('price-up')) satsJpyEl.classList.add('price-up');
                else if (btcUsdEl.classList.contains('price-down')) satsJpyEl.classList.add('price-down');

                updateConverter();
            }
        };
        bitflyerWs.onclose = () => setTimeout(connectBitflyer, 5000); 
    }

    connectBinance();
    connectBitflyer();

    // ==========================================
    // 2. コンバーター（相互計算）ロジック
    // ==========================================
    function updateConverter() {
        if (rateUsd === 0 || rateJpy === 0) return;
        const val = parseFloat(document.getElementById(`input-${currentFocus}`).value) || 0;
        calculateFrom(currentFocus, val);
    }

    function calculateFrom(type, value) {
        if (rateUsd === 0 || rateJpy === 0) return;
        
        let btc = 0;
        if (type === 'sats') btc = value / 100000000;
        else if (type === 'btc') btc = value;
        else if (type === 'jpy') btc = value / rateJpy;
        else if (type === 'usd') btc = value / rateUsd;

        if (type !== 'sats') document.getElementById('input-sats').value = (btc * 100000000).toFixed(0);
        if (type !== 'btc') document.getElementById('input-btc').value = Number(btc.toFixed(8)); 
        if (type !== 'jpy') document.getElementById('input-jpy').value = (btc * rateJpy).toFixed(2);
        if (type !== 'usd') document.getElementById('input-usd').value = (btc * rateUsd).toFixed(2);
    }['sats', 'btc', 'jpy', 'usd'].forEach(type => {
        const el = document.getElementById(`input-${type}`);
        el.addEventListener('input', (e) => {
            currentFocus = type;
            calculateFrom(type, parseFloat(e.target.value) || 0);
        });
        el.addEventListener('focus', () => { currentFocus = type; });
    });

});

// ==========================================
// 3. Twitter シェア機能
// ==========================================
function shareTwitter() {
    const btcUsd = document.getElementById('btc-usd').innerText;
    const satsJpy = document.getElementById('sats-jpy').innerText;
    const text = `The Bitcoin Overview\n\n現在のビットコイン価格は ${btcUsd} 🚀\n1 Satoshi = ${satsJpy}\n\n`;
    const url = window.location.href;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
}

// ==========================================
// 4. ライトニング 投げ銭機能
// ==========================================
function sendTip(amount, address) {
    // ユーザーのウォレットアプリを起動して、アドレスを送金先にセットします
    // ※ 金額(amount)の引き継ぎ可否はユーザーが使用するウォレットの種類に依存します
    window.location.href = `lightning:${address}`;
}
</script>
</body>
</html>
