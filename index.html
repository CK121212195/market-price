<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MARKET OVERVIEW | VOGUE Style</title>
    
    <!-- Google Fonts: VOGUE風のエレガントなセリフ体と、モダンなサンセリフ体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* コントラストを際立たせた純白と漆黒 */
            --bg-color: #FFFFFF;
            --border-color: #EAEAEA;
            --text-main: #000000;
            --text-sub: #888888;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            
            /* プラダを着た悪魔風の鮮烈でクッキリしたハイブランド・カラー */
            --up-color: #00A651; /* ボッテガ・グリーン / 鮮明な緑 */
            --down-color: #E3000F; /* ルブタン・レッド / 鮮烈な赤 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            margin: 0;
            padding: 4rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            text-align: center;
            margin-bottom: 4rem;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 0 0 0.5rem 0;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 300;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card:hover {
            border-color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-main);
        }

        .live-indicator {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            font-weight: 500;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-main);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }

        .card-body {
            font-size: 3.4rem;
            font-weight: 200; /* より細く繊細なフォントウェイト */
            text-align: right;
            letter-spacing: -0.03em;
            margin-top: auto;
            transition: color 0.4s ease;
        }

        /* --- 前日比の上昇・下落カラー --- */
        .price-up {
            color: var(--up-color) !important;
            text-shadow: 0 0 20px rgba(0, 166, 81, 0.1);
        }
        .price-down {
            color: var(--down-color) !important;
            text-shadow: 0 0 20px rgba(227, 0, 15, 0.1);
        }

        .sats-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: auto;
        }

        .sats-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .sats-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .sats-value {
            font-size: 1.8rem;
            font-weight: 300;
            transition: color 0.4s ease;
        }

        .loading {
            color: var(--border-color) !important;
            font-size: 1.5rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .card { height: 200px; padding: 1.5rem; }
            .card-body { font-size: 2.4rem; }
            .dashboard { gap: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>The Market Overview</h1>
        <div class="subtitle">Real-time Financial & Crypto Indices</div>
    </div>

    <div class="dashboard">

        <!-- 1. BTC/USD -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Bitcoin (BTC/USD)</span>
                <span class="live-indicator"><span class="live-dot"></span>LIVE</span>
            </div>
            <div class="card-body loading" id="btc-usd">Fetching...</div>
        </div>

        <!-- 2. 1 Sats -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">1 Satoshi</span>
                <span class="live-indicator"><span class="live-dot"></span>LIVE</span>
            </div>
            <div class="sats-container">
                <div class="sats-item">
                    <span class="sats-label">USD</span>
                    <span class="sats-value loading" id="sats-usd">...</span>
                </div>
                <div class="sats-item">
                    <span class="sats-label">JPY</span>
                    <span class="sats-value loading" id="sats-jpy">...</span>
                </div>
            </div>
        </div>

        <!-- 3. S&P 500 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">S&P 500</span>
                <span class="live-indicator">DAILY</span>
            </div>
            <div class="card-body loading" id="sp500">Fetching...</div>
        </div>

        <!-- 4. 日経平均株価 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Nikkei 225</span>
                <span class="live-indicator">DAILY</span>
            </div>
            <div class="card-body loading" id="nikkei">Fetching...</div>
        </div>

        <!-- 5. 米国債10年金利 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">US 10Y Yield</span>
                <span class="live-indicator">DAILY</span>
            </div>
            <div class="card-body loading" id="us10y">Fetching...</div>
        </div>

        <!-- 6. ドル円為替レート -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">USD / JPY</span>
                <span class="live-indicator">DAILY</span>
            </div>
            <div class="card-body loading" id="usdjpy">Fetching...</div>
        </div>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    
    // ==========================================
    // 1. 仮想通貨のリアルタイムデータ (Binance & bitFlyer)
    // ==========================================
    const btcUsdEl = document.getElementById('btc-usd');
    const satsUsdEl = document.getElementById('sats-usd');
    const satsJpyEl = document.getElementById('sats-jpy');

    function connectBinance() {
        const binanceWs = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');
        binanceWs.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const currentPrice = parseFloat(data.c);
            const priceChange = parseFloat(data.p); 
            
            btcUsdEl.innerText = `$${currentPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const satsUsd = currentPrice / 100000000;
            satsUsdEl.innerText = `$${satsUsd.toFixed(6)}`;

            btcUsdEl.className = 'card-body';
            satsUsdEl.className = 'sats-value';
            satsJpyEl.className = 'sats-value'; 

            // プラダを着た悪魔カラーの適用
            if (priceChange > 0) {
                btcUsdEl.classList.add('price-up');
                satsUsdEl.classList.add('price-up');
                satsJpyEl.classList.add('price-up');
            } else if (priceChange < 0) {
                btcUsdEl.classList.add('price-down');
                satsUsdEl.classList.add('price-down');
                satsJpyEl.classList.add('price-down');
            }
        };
        binanceWs.onclose = () => setTimeout(connectBinance, 5000); 
    }
    connectBinance();

    function connectBitflyer() {
        const bitflyerWs = new WebSocket('wss://ws.lightstream.bitflyer.com/json-rpc');
        bitflyerWs.onopen = () => {
            bitflyerWs.send(JSON.stringify({
                method: "subscribe",
                params: { channel: "lightning_ticker_BTC_JPY" }
            }));
        };
        bitflyerWs.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (response.params && response.params.message) {
                const currentPrice = response.params.message.ltp;
                const satsJpy = currentPrice / 100000000;
                satsJpyEl.innerText = `¥${satsJpy.toFixed(4)}`;
            }
        };
        bitflyerWs.onclose = () => setTimeout(connectBitflyer, 5000); 
    }
    connectBitflyer();

    // ==========================================
    // 2. 株価・金利・為替データ (CNBC APIを利用)
    // N/Aを回避するプロキシ不要の裏ルートエンドポイント
    // ==========================================
    function fetchCNBCData() {
        // scriptタグを使ったJSONPリクエストでCORSブロックを無効化
        const script = document.createElement('script');
        script.src = "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=.SPX,.N225,US10Y-US,JPY=&requestMethod=itv&noform=1&output=json&callback=processCNBCData";
        document.body.appendChild(script);
        
        // 取得完了後にスクリプトタグをお掃除
        script.onload = () => script.remove();
    }

    // CNBCからデータが届いた時に実行される関数
    window.processCNBCData = function(data) {
        if (!data || !data.FormattedQuoteResult || !data.FormattedQuoteResult.FormattedQuote) return;
        
        const quotes = data.FormattedQuoteResult.FormattedQuote;
        
        // CNBCのティッカーとHTMLのIDの紐付け
        const symbolMap = {
            '.SPX': { id: 'sp500', prefix: '', suffix: '' },
            '.N225': { id: 'nikkei', prefix: '¥', suffix: '' },
            'US10Y-US': { id: 'us10y', prefix: '', suffix: '%' },
            'JPY=': { id: 'usdjpy', prefix: '¥', suffix: '' }
        };

        const quoteArray = Array.isArray(quotes) ? quotes : [quotes];

        quoteArray.forEach(quote => {
            const mapInfo = symbolMap[quote.symbol];
            if (!mapInfo) return;

            const el = document.getElementById(mapInfo.id);
            if (!el) return;

            // 価格の表示
            const lastPriceStr = quote.last; 
            el.innerText = `${mapInfo.prefix}${lastPriceStr}${mapInfo.suffix}`;
            
            // 前日比の色付け
            const changeVal = parseFloat(quote.change.replace(/,/g, ''));
            el.className = 'card-body'; 
            if (changeVal > 0) {
                el.classList.add('price-up');
            } else if (changeVal < 0) {
                el.classList.add('price-down');
            }
        });
    };

    // 初回取得と、5分ごとの自動更新
    fetchCNBCData();
    setInterval(fetchCNBCData, 5 * 60 * 1000);

});
</script>
</body>
</html>
